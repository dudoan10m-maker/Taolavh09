services:
  - type: web
    name: toolmowis
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: toolmowis-db
          property: connectionString
      - key: PUBLIC_API_URL
        value: https://taolavh10.onrender.com
      - key: REQUIRE_POSTGRES
        value: "true"

databases:
  - name: toolmowis-db
    databaseName: toolmowis
    user: toolmowis
